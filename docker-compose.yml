version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aliang-postgres
    environment:
      POSTGRES_DB: aliang
      POSTGRES_USER: aliang
      POSTGRES_PASSWORD: aliang123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aliang"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aliang-network

  redis:
    image: redis:7-alpine
    container_name: aliang-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aliang-network

  minio:
    image: minio/minio:latest
    container_name: aliang-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - aliang-network

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  minio-data:
    driver: local

networks:
  aliang-network:
    driver: bridge
